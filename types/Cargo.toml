[package]
name        = "resolution-scope-types"
version     = "26.0.0-alpha.3"
edition     = "2021"
description = "Resolution Scope — shared no_std type definitions (TriState, dispositions, ScoredAnalysis)"
license     = "AGPL-3.0"
repository  = "https://github.com/IT-Help-San-Diego/resolution-scope"

[dependencies]
# Derive + alloc only (no std). The verdict wire format (serde_json) stays at
# the IPC boundary in the engine/native crates; this crate only defines the
# types both sides serialize.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
# std-linked test-only: the accepted-set serde guard needs a JSON codec.
serde_json = "1"
