[package]
name        = "resolution-scope-flipper"
version     = "0.1.0"
edition     = "2021"
description = "Resolution Scope surface flipper — scan once, render in any surface"
license     = "AGPL-3.0"
repository  = "https://github.com/IT-Help-San-Diego/resolution-scope"

[dependencies]
resolution-scope-engine = { path = "../engine" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hickory-resolver = { version = "0.26.1", features = ["dnssec-ring"] }

[[bin]]
name = "rs-flip"
path = "src/main.rs"
