[package]
name        = "resolution-scope-cli"
version     = "26.0.0-alpha.4"
edition     = "2021"
description = "Resolution Scope CLI — scan once, render in any surface (text/html/json) or run the interactive dashboard"
license     = "AGPL-3.0"
repository  = "https://github.com/IT-Help-San-Diego/resolution-scope"

[dependencies]
resolution-scope-engine = { path = "../engine" }
resolution-scope-store = { path = "../store" }
resolution-scope-render = { path = "../render" }

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
hickory-resolver = { version = "0.26.1", features = ["dnssec-ring"] }
serde_json = "1"

# Interactive dashboard (the folded TUI) — ratatui + crossterm.
ratatui = "0.30"
crossterm = "0.29"

[[bin]]
name = "resolution-scope"
path = "src/main.rs"
