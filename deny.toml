# deny.toml — license policy for resolution-scope (AGPL-3.0).
#
# The engine and its surfaces are AGPL-3.0, which is compatible with the
# permissive licenses (MIT, Apache-2.0, BSD, ISC, Zlib, MPL-2.0) AND with the
# GPL-3.0 / LGPL-3.0 / AGPL-3.0 family. It is NOT compatible with GPL-2.0-only
# or LGPL-2.1-only (the "or later" clause is absent, so they cannot combine with
# a GPL-3.0-family work). This policy allows everything AGPL-3.0 can combine
# with and denies the GPL-2.0-only family, so a stray incompatible dependency
# fails the build instead of silently contaminating the license.

[licenses]
allow = [
    # Permissive (the Rust ecosystem norm — mostly dual MIT/Apache-2.0)
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    # Unicode data / permissive-data licenses (ICU, unicode crates)
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "WTFPL",
    # Copyleft (GPL-3.0 family — AGPL-3.0 compatible)
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "GPL-3.0",
    "LGPL-3.0",
    "AGPL-3.0",
    # Public-domain
    "CC0-1.0",
]
# NOTE: cargo-deny v2 config is deny-by-default — every license NOT in the
# allow list above fails the build. The GPL-2.0-only family (GPL-2.0-only,
# LGPL-2.1-only, GPL-1.0-only) is therefore denied without needing a list:
# the "or later" clause is absent, so those cannot combine with a
# GPL-3.0-family work.
# Complex-but-compatible expressions that cargo-deny cannot match as a single
# SPDX id. Each entry is the crate name + its full expression, triaged below.
exceptions = [
    # ring — "Apache-2.0 AND ISC": a combined work of Apache-2.0 and ISC
    # (BoringSSL heritage) code. Both halves are AGPL-compatible; the AND means
    # "comply with both", not "either". Confirmed compatible.
    { name = "ring", allow = ["Apache-2.0", "ISC"] },
    # wasi / wasip2 / wit-bindgen — "Apache-2.0 WITH LLVM-exception": the
    # LLVM exception is the standard Apache-2.0 compiler-runtime carve-out.
    { name = "wasi", allow = ["Apache-2.0"] },
    { name = "wasip2", allow = ["Apache-2.0"] },
    { name = "wit-bindgen", allow = ["Apache-2.0"] },
]

[advisories]
# Vulnerability database check (independent of licenses). Keep on; it fails the
# build on known-vulnerable crates.
yanked = "deny"

[sources]
# Disallow non-crates.io sources so a git/github dependency can't smuggle in an
# unaudited license.
unknown-registry = "deny"
unknown-git = "deny"
