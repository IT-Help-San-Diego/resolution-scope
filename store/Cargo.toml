[package]
name        = "resolution-scope-store"
version     = "0.1.0"
edition     = "2021"
description = "Resolution Scope store — sealed measurement history in PostgreSQL"
license     = "AGPL-3.0"
repository  = "https://github.com/IT-Help-San-Diego/resolution-scope"

# The store is the persistence compartment (ARCHITECTURE.md §3/§4 shape on
# ordinary Linux): it holds DATABASE_URL and nothing else — no resolver, no
# outbound probe client. The engine never depends on the store; the store
# depends on the engine's types. Postgres, local-first, per doctrine:
# scientific users get a real database, never an opaque embedded file.

[dependencies]
resolution-scope-engine = { path = "../engine" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[lib]
path = "src/lib.rs"
