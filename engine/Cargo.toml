# =============================================================================
# resolution-scope-engine — Phase 1 Cargo.toml
# =============================================================================
#
# CRITICAL: the `dnssec-ring` feature MUST remain in [features] default.
#
# hickory-dns compiles cleanly WITHOUT this feature but silently disables all
# DNSSEC validation. There is no build error and no test failure — the code
# just stops verifying signatures. This is the single highest-probability
# silent regression in this stack, and the compile_error! guard in src/lib.rs
# exists to convert it into a hard build failure.
#
# Do NOT remove "dnssec-ring" from the default feature set without a recorded
# architectural decision.
#
# Boundary: tokio and hickory run OUTSIDE any seL4 compartment (docs/
# ARCHITECTURE.md §1). Moving either inside requires a new architecture
# record before merge.
# =============================================================================

[package]
name        = "resolution-scope-engine"
version     = "0.1.0"
edition     = "2021"
description = "Resolution Scope DNS analysis engine — Phase 1 (std + tokio, hickory)"
license     = "AGPL-3.0"
repository  = "https://github.com/IT-Help-San-Diego/resolution-scope"

[features]
default = ["dnssec-ring"]
dnssec-ring = [
    "hickory-resolver/dnssec-ring",
    "hickory-proto/dnssec-ring",
    "hickory-client/dnssec-ring",
]

[dependencies]
hickory-resolver = { version = "0.25", features = ["dnssec-ring", "tls-ring"] }
hickory-proto     = { version = "0.25", features = ["dnssec-ring"] }
hickory-client    = { version = "0.25", features = ["dnssec-ring"] }

tokio = { version = "1", features = ["full"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow    = "1"
thiserror = "1"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "resolution-scope-engine"
path = "src/main.rs"

[lib]
name = "resolution_scope_engine"
path = "src/lib.rs"
