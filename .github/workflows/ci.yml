name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN (CodeQL: actions/missing-workflow-permissions).
# CI only reads the repo (checkout) and builds/tests — it never pushes,
# opens PRs, or writes artifacts — so contents:read is the honest ceiling.
# A compromised workflow with a read-only token can observe, never modify.
permissions:
  contents: read

jobs:
  citation-boundary:
    name: Citation boundary (every non-engine crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: RFC literals stay in the engine
        run: bash scripts/check-citation-boundary.sh

  # One matrix for every host crate — a new renderer is a ONE-TOKEN addition
  # here, not a copied job (the hand-maintained-mirror lesson: flipper shipped
  # with no CI job because the per-crate jobs were copies). native is separate
  # below: its contract is --lib only.
  crates:
    name: ${{ matrix.crate }} — fmt, test, strict clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, tui, web, flipper, store]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo fmt --check
        working-directory: ${{ matrix.crate }}
      - run: cargo test
        working-directory: ${{ matrix.crate }}
      # The strict form is the real gate: plain `cargo clippy` passed while
      # --all-targets was red (items_after_test_module, caught 2026-08-19).
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: ${{ matrix.crate }}

  native-lib:
    name: native — lib build + tests (the ledger contract; bin is bare-metal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # --lib only, per docs/BUILD-STATE.md: the [[bin]] is bare-metal Phase-2
      # code with recorded pre-existing debt; the lib is the host contract.
      - run: cargo build --lib
        working-directory: native
      - run: cargo test --lib
        working-directory: native

  # License gate (deny.toml): v2 config is deny-by-default — any license not
  # on the allow list fails the build. Watched failing locally (MIT removed →
  # licenses FAILED) before being trusted. sources check rejects non-crates.io
  # dependencies so a git dep can't smuggle in an unaudited license.
  licenses:
    name: license gate — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, tui, web, flipper, native, store]
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
          manifest-path: ${{ matrix.crate }}/Cargo.toml

  # Store integration: the sealed-history contract runs against a REAL
  # postgres — sealed roundtrip, tamper detection, cross-version
  # verification, the flux measurement→memory→dispersion loop, migration
  # idempotence. The tests are #[ignore]d locally (no DB assumed);
  # --include-ignored here means the gate genuinely executes them — an
  # env-gated silent skip would be a check that cannot fail.
  store-integration:
    name: store — sealed history against live postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rs
          POSTGRES_DB: rs_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RS_STORE_TEST_URL: postgres://postgres:rs@localhost:5432/rs_store
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: store
      - run: cargo test -- --include-ignored
        working-directory: store

  # Lean proofs: the scoring doctrine is machine-checked, not just unit-tested.
  # A proof that isn't re-checked on every commit drifts into a claim. This is
  # the "logic as universal decoder" layer — a reader runs `lean lean/Scoring.lean`
  # and verifies the doctrine without running (or trusting) the Rust. Pinned via
  # lean-toolchain so a new Lean version can't silently change what "proved" means.
  lean-proofs:
    name: Lean proofs — Scoring.lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lean (pinned via lean-toolchain)
        run: |
          set -euo pipefail
          TOOLCHAIN=$(cat lean-toolchain)
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN" --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify the scoring doctrine
        run: lean lean/Scoring.lean
