name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  citation-boundary:
    name: Citation boundary (every non-engine crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: RFC literals stay in the engine
        run: bash scripts/check-citation-boundary.sh

  # One matrix for every host crate — a new renderer is a ONE-TOKEN addition
  # here, not a copied job (the hand-maintained-mirror lesson: flipper shipped
  # with no CI job because the per-crate jobs were copies). native is separate
  # below: its contract is --lib only.
  crates:
    name: ${{ matrix.crate }} — fmt, test, strict clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, tui, web, flipper]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo fmt --check
        working-directory: ${{ matrix.crate }}
      - run: cargo test
        working-directory: ${{ matrix.crate }}
      # The strict form is the real gate: plain `cargo clippy` passed while
      # --all-targets was red (items_after_test_module, caught 2026-08-19).
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: ${{ matrix.crate }}

  native-lib:
    name: native — lib build + tests (the ledger contract; bin is bare-metal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # --lib only, per docs/BUILD-STATE.md: the [[bin]] is bare-metal Phase-2
      # code with recorded pre-existing debt; the lib is the host contract.
      - run: cargo build --lib
        working-directory: native
      - run: cargo test --lib
        working-directory: native

  # License gate (deny.toml): v2 config is deny-by-default — any license not
  # on the allow list fails the build. Watched failing locally (MIT removed →
  # licenses FAILED) before being trusted. sources check rejects non-crates.io
  # dependencies so a git dep can't smuggle in an unaudited license.
  licenses:
    name: license gate — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, tui, web, flipper, native]
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
          manifest-path: ${{ matrix.crate }}/Cargo.toml
