name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN (CodeQL: actions/missing-workflow-permissions).
# CI only reads the repo (checkout) and builds/tests — it never pushes,
# opens PRs, or writes artifacts — so contents:read is the honest ceiling.
# A compromised workflow with a read-only token can observe, never modify.
permissions:
  contents: read

# Cancel superseded PR runs; NEVER cancel a main push — a cancelled main run
# is a gap in the measurement record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every third-party action is pinned by full commit SHA (the tag comment is
# for humans; the SHA is the gate). A mutable tag — or worse, a branch ref —
# lets an upstream retag/compromise rewrite what "green" means. dependabot's
# github-actions ecosystem keeps the pins fresh. persist-credentials: false
# on every checkout: no step here needs the git-config token afterward.

jobs:
  citation-boundary:
    name: Citation boundary (every non-engine crate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      - name: RFC literals stay in the engine
        run: bash scripts/check-citation-boundary.sh

  seal-scheme-consistency:
    # Foundation queue #3: the v5 bump nearly shipped without a KAT (2e-F1);
    # review caught it, this gate makes the catch mechanical. Every scheme
    # the engine names must carry a byte-frozen known-answer literal, the
    # current scheme MUST have its KAT minted at introduction, and retained
    # schemes must stay dispatched (re-derivable). Watched failing before
    # shipping: rename the v5 KAT -> exit 1, named reason.
    name: Seal scheme consistency (KAT per scheme, builders dispatched)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      - name: Every seal scheme is KAT'd, literal-pinned, and re-derivable
        run: bash scripts/check-seal-scheme-consistency.sh

  # One matrix for every host crate — a new renderer is a ONE-TOKEN addition
  # here, not a copied job (the hand-maintained-mirror lesson: flipper shipped
  # with no CI job because the per-crate jobs were copies). native is separate
  # below: its contract is --lib only. The three surface crates (tui/web/flipper)
  # collapsed into `cli` on 2026-08-20 — one binary, subcommands. `types` (the
  # shared no_std type crate) is a normal member: its tests pin the seal's
  # variant-name contract.
  crates:
    name: ${{ matrix.crate }} — fmt, test, strict clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, cli, render, store, types, pq-harness, signer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain selects the toolchain via `with:` once pinned
      # by SHA (the @stable form is a MOVING BRANCH ref — the one class of
      # unpinned input this file no longer contains).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-29
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo fmt --check
        working-directory: ${{ matrix.crate }}
      # --locked on a build leg: lockfile drift is structurally invisible
      # without it (plain cargo test resolves a fresh lock in memory and
      # passes green), and the ONLY --locked consumer was release.yml —
      # which runs solely on v* tags. That gap let the sha3 0.10.9→0.12.0
      # manifest bumps ship with stale cli/store lockfiles that CI blessed
      # and the tag build then refused (exit 101, all four legs, ledger
      # 2026-09-02T06:20Z). Drift must fail on the PR that introduces it.
      - run: cargo build --locked --quiet
        working-directory: ${{ matrix.crate }}
      - run: cargo test --locked
        working-directory: ${{ matrix.crate }}
      # The strict form is the real gate: plain `cargo clippy` passed while
      # --all-targets was red (items_after_test_module, caught 2026-08-19).
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: ${{ matrix.crate }}

  native-lib:
    name: native — lib build + tests (the ledger contract; bin is bare-metal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-29
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
      # --lib only, per docs/BUILD-STATE.md: the [[bin]] is bare-metal Phase-2
      # code with recorded pre-existing debt; the lib is the host contract.
      - run: cargo build --lib
        working-directory: native
      - run: cargo test --lib
        working-directory: native
      # Strict clippy on the lib, both targets — the crate holding the no_std
      # seal contract was the only one exempt from -D warnings (audit
      # 2026-08-29). Scoped to --lib: the bin debt is recorded, not ignored.
      # (cargo fmt is file-global and would trip on the bin — deferred with
      # the same debt record.)
      - run: cargo clippy --lib -- -D warnings
        working-directory: native
      - run: cargo clippy --lib --target aarch64-unknown-none -- -D warnings
        working-directory: native
      # Bare-metal compile gate: the lib must build for the no_std target it is
      # destined for (aarch64-unknown-none), not just the host. Catches the
      # "compiles on host, breaks on target" class — e.g. an accidental std::
      # reference that a host `cargo build --lib` (which links std) would not
      # surface. No SDK needed; check is type-only (~30s), no link.
      - run: cargo check --lib --target aarch64-unknown-none
        working-directory: native

  # License gate (deny.toml): v2 config is deny-by-default — any license not
  # on the allow list fails the build. Watched failing locally (MIT removed →
  # licenses FAILED) before being trusted. sources check rejects non-crates.io
  # dependencies so a git dep can't smuggle in an unaudited license.
  # Advisories are NOT here: they fail without a commit, so they live in
  # audit.yml (scheduled + dep-touching PRs) where red means "act on the
  # advisory," not "this PR broke something."
  licenses:
    name: license gate — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, cli, render, native, store, types, pq-harness, signer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses sources
          manifest-path: ${{ matrix.crate }}/Cargo.toml

  pq-monitor-script:
    name: pq monitor script — unit tests + syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      - name: Script syntax
        run: |
          python3 -m py_compile scripts/pq_fixture_monitor.py scripts/test_pq_fixture_monitor.py scripts/test_publish_report.py
          bash -n scripts/publish-report.sh
      - name: Unit tests
        run: |
          python3 scripts/test_pq_fixture_monitor.py
          python3 scripts/test_publish_report.py

  # Store integration: the sealed-history contract runs against a REAL
  # postgres — sealed roundtrip, tamper detection, cross-version
  # verification, the flux measurement→memory→dispersion loop, migration
  # idempotence. The tests are #[ignore]d locally (no DB assumed);
  # --include-ignored here means the gate genuinely executes them — an
  # env-gated silent skip would be a check that cannot fail.
  store-integration:
    name: store — sealed history against live postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rs
          POSTGRES_DB: rs_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RS_STORE_TEST_URL: postgres://postgres:rs@localhost:5432/rs_store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-29
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: store
      - run: cargo test -- --include-ignored
        working-directory: store

  # Lean proofs: the scoring doctrine is machine-checked, not just unit-tested.
  # A proof that isn't re-checked on every commit drifts into a claim. This is
  # the "logic as universal decoder" layer — a reader runs
  # `lean engine/lean/Scoring.lean` and verifies the doctrine without running
  # (or trusting) the Rust. The spec lives INSIDE the engine crate so the
  # instrument ships self-contained (no fragile cross-crate include_str path).
  # Pinned via lean-toolchain so a new Lean version can't silently change what
  # "proved" means.
  lean-proofs:
    name: Lean proofs — Scoring.lean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 tag @ 2026-08-29
        with:
          persist-credentials: false
      - name: Install Lean (pinned via lean-toolchain)
        run: |
          set -euo pipefail
          TOOLCHAIN=$(cat lean-toolchain)
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN" --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify the scoring doctrine
        run: lean -DwarningAsError=true engine/lean/Scoring.lean

  # Fan-in: the ONE stable context branch protection can require. Matrix legs
  # have dynamic names that break required-check lists silently on rename;
  # this job waits on everything and fails on any failure, cancellation, OR
  # skip (a skipped gate that reads as neutral-green is a check that cannot
  # fail — the required context must go red, not silent).
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [
        citation-boundary,
        seal-scheme-consistency,
        crates,
        native-lib,
        licenses,
        pq-monitor-script,
        store-integration,
        lean-proofs,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All gates green (skipped/cancelled count as failure)
        run: |
          test "${{ contains(needs.*.result, 'failure') }}" = "false"
          test "${{ contains(needs.*.result, 'cancelled') }}" = "false"
          test "${{ contains(needs.*.result, 'skipped') }}" = "false"
