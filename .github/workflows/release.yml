name: Release binaries

# A tag build is the distributable path: today "using Resolution Scope"
# means cloning and building; a v* tag turns into a GitHub Release carrying
# the CLI for the four native targets, each with a sha256 receipt beside
# it. Native runners only — no cross toolchain, no third-party build
# actions (every action here is the repo's pinned checkout).
#
# The binary stamps its own provenance (CARGO_PKG_VERSION + git-describe
# via engine/build.rs), so a tagged build prints a clean version and the
# smoke step refuses to ship a binary that cannot say what it is.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release CLASS is derived from the tag, and an unrecognised
          # shape STOPS the workflow rather than defaulting to stable.
          # Without this, `gh release create --draft` wrote `prerelease:
          # false`, and `--draft=false` at publish then made an ALPHA the
          # repository's /releases/latest — the field every installer and
          # package manager keys on. It is the same conflation this file
          # already fixed one layer down at the version-field gate: there a
          # glob could not tell an alpha from a GA build, here the metadata
          # could not either. Fail closed, because the dangerous direction is
          # an unanticipated tag shipping quietly as stable.
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) PRE="--prerelease" ;;
            # ORDER IS LOAD-BEARING and this arm is why. `v[0-9]*.[0-9]*.[0-9]*`
            # SUBSUMES every pre-release tag — `[0-9]*` is one digit then
            # anything, so it matches `v26.0.0-alpha.4` too. Without this arm,
            # a tag carrying an UNRECOGNISED suffix (-dev, -pre, -snapshot,
            # -preview) fell through to the stable arm and PUBLISHED AS A FULL
            # RELEASE, while the read-back at the end of this file agreed with
            # it — both controls sharing one class list cannot disagree about a
            # suffix neither knows. The old error text promised "refusing to
            # guess"; measured, it only refused tags that did not look like
            # versions at all, and guessed STABLE for every other one.
            # Any hyphenated suffix we do not recognise now fails closed.
            *-*) echo "::error::tag '$GITHUB_REF_NAME' carries an unrecognised pre-release suffix — known classes are -alpha*, -beta*, -rc*. Refusing to publish it as a stable release; add the class to BOTH case statements in this file if it is intended"; exit 1 ;;
            v[0-9]*.[0-9]*.[0-9]*)  PRE="" ;;
            *) echo "::error::tag '$GITHUB_REF_NAME' matches no known release class (expected vX.Y.Z or vX.Y.Z-alpha/beta/rc*) — refusing to guess"; exit 1 ;;
          esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag $PRE \
              --title "resolution-scope $GITHUB_REF_NAME" \
              --notes "Sealed-verdict DNS posture instrument — CLI binaries. Verify each artifact against its .sha256 receipt."

  build:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          # macos-13 (Intel) was RETIRED by GitHub 2026-09 — a job targeting a
          # removed runner label queues forever instead of failing, which sat
          # the v26.0.0-alpha.2 release in a 25h silent queue (ledger
          # 2026-09-02T05:55Z). Fix: build the Intel target on the arm64
          # runner — macOS arm64 runs x86_64 binaries natively via Rosetta 2,
          # so the smoke test stays honest (it EXECUTES the cross-built
          # binary, not just packages it).
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # build.rs stamps git-describe; a shallow clone would stamp a
          # bare hash instead of the tag (the SciSpace-flagged edge).
          fetch-depth: 0
      - name: Install cross-compile target when runner ≠ target
        run: rustup target add --toolchain stable ${{ matrix.target }}
      - name: Build release binary (locked)
        working-directory: cli
        # Cross-compile when the matrix target differs from the runner's host
        # triple: cargo needs --target to select the cross toolchain, and the
        # binary then lands under target/<triple>/release/ instead of
        # target/release/. Same-runner builds stay native (no flag, no path
        # shift) — the two macOS targets both run on macos-14 arm64, where
        # Rosetta 2 executes the x86_64 binary for the smoke test.
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | grep 'host:' | awk '{print $2}')
          if [ "$HOST" != "${{ matrix.target }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked
          fi
      - name: Smoke — the binary must say EXACTLY what it is
        # Hardened per the parity-floor finding (ledger 2026-09-02T07:55Z):
        # the old assertion grepped for the literal "resolution-scope" and
        # passed while the published alpha.2 binaries misreported
        # 26.0.0-alpha.1 — a guard that could not fire for the defect it
        # existed to prevent, on a provenance instrument. The version must
        # now CONTAIN THE TAG: clap derives --version from CARGO_PKG_VERSION,
        # so a manifest/tag mismatch fails the release build itself.
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | grep 'host:' | awk '{print $2}')
          if [ "$HOST" != "${{ matrix.target }}" ]; then
            BIN="cli/target/${{ matrix.target }}/release/resolution-scope"
          else
            BIN="cli/target/release/resolution-scope"
          fi
          OUT=$("$BIN" --version)
          echo "$OUT"
          # GITHUB_REF_NAME carries the leading 'v' (v26.0.0-alpha.3); the
          # crate version clap prints does not (26.0.0-alpha.3). Compare the
          # version FIELD EXACTLY (CC amendment 23:40Z: a substring match
          # lets an alpha binary ship clean under a GA tag —
          # `*resolution-scope*26.0.0*` matches `26.0.0-alpha.3` — so the
          # field must be equal, not contained).
          EXPECT="${GITHUB_REF_NAME#v}"
          set -- $OUT
          if [ "$2" != "$EXPECT" ]; then
            echo "::error::--version field is '$2', expected exactly '$EXPECT' (tag ${GITHUB_REF_NAME}) — manifest/tag drift; refuse to ship"
            exit 1
          fi
            # AND THE ENGINE STAMP, which the check above structurally
            # cannot see. `$2` is clap's version: the CLI crate's
            # CARGO_PKG_VERSION. The ENGINE's git-describe stamp is a
            # different string, and it is the one hashed into every seal as
            # preimage line 3. Nothing in the release path observed it, which
            # is precisely how `26.0.0-alpha.4-v26.0.0-alpha.4` shipped past a
            # green gate. Measured at that tag with the pre-fix engine: `$2`
            # passes and `$4` fails, so this assertion would have stopped that
            # publish. A clean tag checkout composes the bare version; a dirty
            # tree, a lost git dir or a doubled stamp all differ and are
            # refused — a release is built from a clean tag or it is not built.
            if [ "$4" != "$EXPECT" ]; then
              echo "::error::engine stamp is '$4', expected exactly '$EXPECT' — the seal-bearing provenance string disagrees with the tag; refuse to ship"
              exit 1
            fi
            echo "cli version and engine stamp both name ${GITHUB_REF_NAME}"
      - name: Package with sha256 receipt
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | grep 'host:' | awk '{print $2}')
          if [ "$HOST" != "${{ matrix.target }}" ]; then
            BIN="cli/target/${{ matrix.target }}/release/resolution-scope"
          else
            BIN="cli/target/release/resolution-scope"
          fi
          NAME="resolution-scope-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cp "$BIN" "$NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME" > "$NAME.sha256"
          else
            shasum -a 256 "$NAME" > "$NAME.sha256"
          fi
          cat "$NAME.sha256"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="resolution-scope-${GITHUB_REF_NAME}-${{ matrix.target }}"
          gh release upload "$GITHUB_REF_NAME" "$NAME" "$NAME.sha256" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Publish — all four targets present or the release stays draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $ASSETS"
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            case "$ASSETS" in
              *"$t"*) ;;
              *) echo "::error::missing target $t — refusing to publish a partial release"; exit 1 ;;
            esac
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
          # Verify by content, not by the absence of a red check: read the
          # published flag BACK and assert it matches the tag's class. A
          # metadata claim nobody re-reads is a claim nobody checked.
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) WANT=true ;;
            # Mirrors the create step's refusal so the two cannot silently
            # diverge. Unreachable while the create step refuses first, which
            # is the point: a control that agrees only because it shares the
            # other's blind spot is not a second control.
            *-*) echo "::error::tag '$GITHUB_REF_NAME' carries an unrecognised pre-release suffix — refusing to assert a flag for a class this workflow does not know"; exit 1 ;;
            *) WANT=false ;;
          esac
          GOT=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::published prerelease flag is '$GOT', expected '$WANT' for tag $GITHUB_REF_NAME"; exit 1
          fi
          echo "published $GITHUB_REF_NAME with prerelease=$GOT"
      # THE RECEIPT IS THE ONE CLAIM THIS RELEASE ASKS STRANGERS TO TRUST —
      # the notes say "Verify each artifact against its .sha256 receipt" — and
      # until now it was the only outward-facing claim here with NO read-back.
      # The prerelease flag above IS read back, under a comment saying a
      # metadata claim nobody re-reads is a claim nobody checked. The receipt
      # was exactly that claim: it is computed on the build runner, then the
      # binary and the receipt are uploaded as two INDEPENDENT objects, and
      # --clobber means a re-run can replace one of them. The gate above checks
      # only that asset NAMES mention each target, which is presence, not
      # integrity.
      #
      # This lives in `publish`, not in `build`, deliberately. GitHub computes
      # the asset digest server-side and may do it asynchronously, so a check
      # firing immediately after upload could race it and fail a good release —
      # a false red on the release path, which this repository has already paid
      # for once. `publish` runs after all four builds. Measured on
      # v26.0.0-alpha.4: last upload 07:29:41Z, release published 07:29:53Z,
      # all eight digests populated. Only the receipts are fetched here, about
      # 120 bytes each; the binaries are never downloaded.
      - name: Read every receipt BACK against the digest GitHub stored
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _receipts && cd _receipts
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --clobber
          n=0
          for r in *.sha256; do
            BIN="${r%.sha256}"
            WANT="sha256:$(cut -d' ' -f1 < "$r")"
            GOT=$(gh release view "$GITHUB_REF_NAME" --json assets \
                    --jq ".assets[] | select(.name==\"$BIN\") | .digest // empty")
            if [ -z "$GOT" ]; then
              echo "::error::no stored digest for $BIN — cannot confirm it matches the receipt users are told to check it against"; exit 1
            fi
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::$BIN has stored digest $GOT but its published receipt says $WANT — the artifact and its receipt disagree"; exit 1
            fi
            echo "  verified $BIN $GOT"
            n=$((n + 1))
          done
          # Fail closed: zero receipts verified is not a pass.
          if [ "$n" -ne 4 ]; then
            echo "::error::verified $n receipts, expected 4 — a target shipped without one, and a binary whose receipt is missing is unverifiable to a user"; exit 1
          fi
          echo "all $n receipts match the artifacts GitHub stored"
