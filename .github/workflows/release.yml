name: Release binaries

# A tag build is the distributable path: today "using Resolution Scope"
# means cloning and building; a v* tag turns into a GitHub Release carrying
# the CLI for the four native targets, each with a sha256 receipt beside
# it. Native runners only — no cross toolchain, no third-party build
# actions (every action here is the repo's pinned checkout).
#
# The binary stamps its own provenance (CARGO_PKG_VERSION + git-describe
# via engine/build.rs), so a tagged build prints a clean version and the
# smoke step refuses to ship a binary that cannot say what it is.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "resolution-scope $GITHUB_REF_NAME" \
              --notes "Sealed-verdict DNS posture instrument — CLI binaries. Verify each artifact against its .sha256 receipt."

  build:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          # macos-13 (Intel) was RETIRED by GitHub 2026-09 — a job targeting a
          # removed runner label queues forever instead of failing, which sat
          # the v26.0.0-alpha.2 release in a 25h silent queue (ledger
          # 2026-09-02T05:55Z). Fix: build the Intel target on the arm64
          # runner — macOS arm64 runs x86_64 binaries natively via Rosetta 2,
          # so the smoke test stays honest (it EXECUTES the cross-built
          # binary, not just packages it).
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # build.rs stamps git-describe; a shallow clone would stamp a
          # bare hash instead of the tag (the SciSpace-flagged edge).
          fetch-depth: 0
      - name: Install cross-compile target when runner ≠ target
        run: rustup target add --toolchain stable ${{ matrix.target }}
      - name: Build release binary (locked)
        working-directory: cli
        # Cross-compile when the matrix target differs from the runner's host
        # triple: cargo needs --target to select the cross toolchain, and the
        # binary then lands under target/<triple>/release/ instead of
        # target/release/. Same-runner builds stay native (no flag, no path
        # shift) — the two macOS targets both run on macos-14 arm64, where
        # Rosetta 2 executes the x86_64 binary for the smoke test.
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | grep 'host:' | awk '{print $2}')
          if [ "$HOST" != "${{ matrix.target }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked
          fi
      - name: Smoke — the binary must say EXACTLY what it is
        # Hardened per the parity-floor finding (ledger 2026-09-02T07:55Z):
        # the old assertion grepped for the literal "resolution-scope" and
        # passed while the published alpha.2 binaries misreported
        # 26.0.0-alpha.1 — a guard that could not fire for the defect it
        # existed to prevent, on a provenance instrument. The version must
        # now CONTAIN THE TAG: clap derives --version from CARGO_PKG_VERSION,
        # so a manifest/tag mismatch fails the release build itself.
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | grep 'host:' | awk '{print $2}')
          if [ "$HOST" != "${{ matrix.target }}" ]; then
            BIN="cli/target/${{ matrix.target }}/release/resolution-scope"
          else
            BIN="cli/target/release/resolution-scope"
          fi
          OUT=$("$BIN" --version)
          echo "$OUT"
          # GITHUB_REF_NAME carries the leading 'v' (v26.0.0-alpha.3); the
          # crate version clap prints does not (26.0.0-alpha.3). Compare the
          # version FIELD EXACTLY (CC amendment 23:40Z: a substring match
          # lets an alpha binary ship clean under a GA tag —
          # `*resolution-scope*26.0.0*` matches `26.0.0-alpha.3` — so the
          # field must be equal, not contained).
          EXPECT="${GITHUB_REF_NAME#v}"
          set -- $OUT
          if [ "$2" != "$EXPECT" ]; then
            echo "::error::--version field is '$2', expected exactly '$EXPECT' (tag ${GITHUB_REF_NAME}) — manifest/tag drift; refuse to ship"
            exit 1
          fi
      - name: Package with sha256 receipt
        run: |
          set -euo pipefail
          HOST=$(rustc -vV | grep 'host:' | awk '{print $2}')
          if [ "$HOST" != "${{ matrix.target }}" ]; then
            BIN="cli/target/${{ matrix.target }}/release/resolution-scope"
          else
            BIN="cli/target/release/resolution-scope"
          fi
          NAME="resolution-scope-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cp "$BIN" "$NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME" > "$NAME.sha256"
          else
            shasum -a 256 "$NAME" > "$NAME.sha256"
          fi
          cat "$NAME.sha256"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="resolution-scope-${GITHUB_REF_NAME}-${{ matrix.target }}"
          gh release upload "$GITHUB_REF_NAME" "$NAME" "$NAME.sha256" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Publish — all four targets present or the release stays draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $ASSETS"
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            case "$ASSETS" in
              *"$t"*) ;;
              *) echo "::error::missing target $t — refusing to publish a partial release"; exit 1 ;;
            esac
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
