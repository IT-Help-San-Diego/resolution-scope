name: Bug
description: A non-verdict defect (crash, rendering, store, build)
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Exact command or reproduction steps
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened (paste the output)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
