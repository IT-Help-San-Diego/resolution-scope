# =============================================================================
# resolution-scope-native — Phase 2 Cargo.toml (Option B: report/store receiver)
# =============================================================================
#
# Under Option B (docs/ARCHITECTURE.md §7) the no_std compartment does NOT run
# the DNS engine: it RECEIVES a ScoredAnalysis, re-derives the verdict seal, and
# renders/writes. No smoltcp, no hickory-proto, no ring — those were the pre-B
# "DNS engine inside the compartment" shape that Option B abandoned (see
# docs/seL4-demo-state-and-model-drift-20260822.md).
#
# This crate is a SIBLING of engine/ (Phase 1), NOT a replacement. Both phases
# coexist during migration. There is intentionally NO Cargo workspace: feature
# unification between a std+tokio crate and a no_std crate is a genuine hazard.
# =============================================================================

[package]
name        = "resolution-scope-native"
version     = "0.1.0"
edition     = "2021"
description = "Resolution Scope — Phase 2 LionsOS native compartment (no_std report/store receiver)"
license     = "AGPL-3.0"
repository  = "https://github.com/IT-Help-San-Diego/resolution-scope"

[lib]
name = "resolution_scope_native"
path = "src/lib.rs"

[[bin]]
name = "resolution-scope-native"
path = "src/main_native.rs"
# Bare-metal only (no_std, custom panic handler, #[no_mangle] main). It cannot
# link on a host OS. Build it with:
#   cargo build --target aarch64-unknown-none --release
# Host-side verification runs against the LIBRARY via `cargo test --lib`.
test = false

[dependencies]
# The verdict type surface (TriState, the eight dispositions, ScoredAnalysis) —
# the single producer, shared with engine/. Replaces the former hand-kept mirror
# (native/src/{tristate,types}.rs, now deleted).
resolution-scope-types = { path = "../types" }

# SHA3-512 for the verdict seal. Pure Rust, no_std, no C sources — this is what
# removed the `ring` → `assert.h` cross-compile blocker that stalled the pre-B
# shape (ring has C; sha3 does not).
sha3 = { version = "0.10", default-features = false }

# JSON wire format for the IPC boundary (ffi.rs). This is the SAME format the
# engine emits (serde_json on the std side), so a verdict serialised by the
# engine deserialises byte-identically in the no_std store. alloc-only.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level     = "z"    # minimise binary footprint inside the seL4 compartment
lto           = true
codegen-units = 1
panic         = "abort" # required for no_std; no unwinding runtime available
strip         = true

[profile.dev]
panic = "abort"         # keep consistent with release; no unwinding in either phase
